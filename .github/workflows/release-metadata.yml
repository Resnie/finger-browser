name: 统一版本展示

on:
  release:
    types: [published, edited]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release-metadata
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repository = context.repo;
            const versionPattern = /^v?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/;
            const listReleases = () => github.paginate(github.rest.repos.listReleases, {
              ...repository, per_page: 100,
            });
            const releases = await listReleases();
            for (const release of releases) {
              const version = versionPattern.exec(release.tag_name)?.[1];
              if ((release.body || '') === '' && (!version || release.name === version)) continue;
              await github.rest.repos.updateRelease({
                ...repository,
                release_id: release.id,
                body: '',
                ...(version ? { name: version } : {}),
              });
            }

            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              ...repository, ref: 'tags/', per_page: 100,
            });
            let versionTags = 0;
            for (const ref of refs) {
              const tagName = ref.ref.replace(/^refs\/tags\//, '');
              const version = versionPattern.exec(tagName)?.[1];
              if (!version) continue;
              versionTags += 1;
              if (ref.object.type !== 'tag') continue;
              const { data: tag } = await github.rest.git.getTag({
                ...repository, tag_sha: ref.object.sha,
              });
              if (['', tagName, version].includes(tag.message.trim())) continue;
              const { data: replacement } = await github.rest.git.createTag({
                ...repository,
                tag: tagName,
                message: `${tagName}\n`,
                object: tag.object.sha,
                type: tag.object.type,
                tagger: tag.tagger,
              });
              const refName = ref.ref.replace(/^refs\//, '');
              const { data: current } = await github.rest.git.getRef({
                ...repository, ref: refName,
              });
              if (current.object.sha !== ref.object.sha) {
                throw new Error(`${tagName} 已变化，停止更新标签注释`);
              }
              await github.rest.git.updateRef({
                ...repository, ref: refName, sha: replacement.sha, force: true,
              });
              const { data: verified } = await github.rest.git.getRef({
                ...repository, ref: refName,
              });
              if (verified.object.sha !== replacement.sha ||
                  replacement.object.sha !== tag.object.sha ||
                  replacement.object.type !== tag.object.type ||
                  replacement.message.trim() !== tagName) {
                throw new Error(`${tagName} 标签注释核验失败`);
              }
            }

            const verifiedReleases = await listReleases();
            for (const release of verifiedReleases) {
              const version = versionPattern.exec(release.tag_name)?.[1];
              if ((release.body || '') !== '' || (version && release.name !== version)) {
                throw new Error(`${release.tag_name} 的标题或简介不符合发布规则`);
              }
            }
            const versions = verifiedReleases.filter(release => versionPattern.test(release.tag_name));
            core.info(`已核验 ${versions.length} 个应用版本、${versionTags} 个版本标签；简介全部为空。`);
